name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  projects:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python lint and test tools
        run: pip install -r .github/ci-requirements.txt
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: make lint test for every project
        run: |
          shopt -s nullglob
          for dir in projects/*/; do
            if [ -f "$dir/Makefile" ]; then
              echo "::group::$dir"
              make -C "$dir" lint test
              echo "::endgroup::"
            fi
          done
