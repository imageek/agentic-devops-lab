name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment): a tag can be
# moved to different code, a SHA can't. To bump, resolve the new tag's SHA with
#   gh api repos/<owner>/<repo>/commits/<tag> -q .sha
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  projects:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python lint and test tools
        run: pip install -r .github/ci-requirements.txt
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: make lint test for every project
        run: |
          shopt -s nullglob
          for dir in projects/*/; do
            if [ -f "$dir/Makefile" ]; then
              echo "::group::$dir"
              make -C "$dir" lint test
              echo "::endgroup::"
            fi
          done
